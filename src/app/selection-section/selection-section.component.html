<section class="selection-section">
	<div class="selection-section__choices">
		@for (choice of choices(); track choice.id) {
			<button
				type="button"
				class="choice"
				[class.choice--selected]="selectedOption().taskType === choice.taskType"
				(click)="selectOption(choice.taskType)"
				[attr.aria-pressed]="selectedOption().taskType === choice.taskType"
			>
				<i [class]="choice.icon" class="choice__icon"></i>
				<div class="choice__content">
					<div class="choice__title">{{ choice.title }}</div>
					<p class="choice__desc">{{ choice.description }}</p>
				</div>
			</button>
		}
	</div>

	@if (selectedTaskType() !== 'clustering') {
		<div class="selection-section__target">
			<label class="selection-section__label">Select Target Variable</label>
			<div class="selection-section__control">
				<select
					class="target-select"
					[value]="selectedTargetColumn() ?? ''"
					(change)="selectTargetColumn($event)"
				>
					<option value="" disabled>Select target column</option>
					@for (option of selectedFile()?.columns; track $index) {
						<option [value]="option">{{ option }}</option>
					}
				</select>
			</div>
		</div>
	}
</section>
