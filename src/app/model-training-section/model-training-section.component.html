<section class="training-section" aria-labelledby="model-training-title">
	<div class="training-container">
		<div class="training-card">
			<p class="section-description">Train a model using the uploaded dataset.</p>

			<button
				type="button"
				class="submit-button"
				(click)="trainModel()"
				[disabled]="isInProgress()"
			>
				@if (isInProgress()) {
					<span class="spinner" aria-hidden="true"></span>
					<span>Training...</span>
				} @else {
					<span>Train Model</span>
				}
			</button>
		</div>
	</div>
</section>
